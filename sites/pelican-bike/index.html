<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>鹈鹕骑自行车</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1.25rem;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
      background: linear-gradient(165deg, #cfe8f7 0%, #eef6fb 45%, #f7f0e6 100%);
      color: #1e3a4c;
    }
    h1 {
      font-size: clamp(1.35rem, 5vw, 1.85rem);
      font-weight: 700;
      letter-spacing: 0.08em;
    }
    .stage {
      width: min(94vw, 480px);
      background: #fff;
      border-radius: 1.4rem;
      box-shadow: 0 18px 50px rgba(30, 58, 76, 0.14);
      overflow: hidden;
    }
    .stage svg { display: block; width: 100%; height: auto; }
    .hint { font-size: 0.8rem; opacity: 0.5; }
  </style>
</head>
<body>
  <h1>鹈鹕骑自行车</h1>
  <div class="stage" role="img" aria-label="鹈鹕骑自行车插画，车轮转动">
    <svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#9fd4f0"/>
          <stop offset="55%" stop-color="#d7eef9"/>
          <stop offset="100%" stop-color="#f3f8fc"/>
        </linearGradient>
        <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#8a9aa8"/>
          <stop offset="100%" stop-color="#6d7d8b"/>
        </linearGradient>
        <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="100%" stop-color="#e8eef4"/>
        </linearGradient>
        <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffb347"/>
          <stop offset="100%" stop-color="#e8890c"/>
        </linearGradient>
        <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1e3a4c" flood-opacity="0.18"/>
        </filter>
      </defs>

      <!-- background -->
      <rect width="480" height="360" fill="url(#sky)"/>
      <!-- sun -->
      <circle cx="400" cy="58" r="28" fill="#ffe08a" opacity="0.95"/>
      <circle cx="400" cy="58" r="40" fill="#ffe08a" opacity="0.25"/>
      <!-- clouds -->
      <g fill="#fff" opacity="0.9">
        <ellipse cx="90" cy="70" rx="42" ry="18"/>
        <ellipse cx="118" cy="66" rx="28" ry="14"/>
        <ellipse cx="62" cy="72" rx="22" ry="12"/>
        <ellipse cx="250" cy="48" rx="34" ry="14"/>
        <ellipse cx="272" cy="46" rx="20" ry="10"/>
      </g>
      <!-- hills -->
      <path d="M0 250 Q80 210 160 240 T320 230 T480 250 L480 300 L0 300 Z" fill="#7ec98a" opacity="0.55"/>
      <path d="M0 265 Q120 235 220 260 T480 255 L480 300 L0 300 Z" fill="#62b574" opacity="0.7"/>
      <!-- road -->
      <rect y="288" width="480" height="72" fill="url(#road)"/>
      <g stroke="#dfe6ec" stroke-width="4" stroke-dasharray="28 22" opacity="0.85">
        <line x1="-40" y1="324" x2="520" y2="324">
          <animate attributeName="stroke-dashoffset" from="0" to="-50" dur="0.7s" repeatCount="indefinite"/>
        </line>
      </g>

      <!-- rider group with slight bounce -->
      <g filter="url(#soft)">
        <animateTransform attributeName="transform" type="translate"
          values="0 0; 0 -2; 0 0" dur="0.55s" repeatCount="indefinite"/>

        <!-- bike -->
        <g stroke="#243447" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <!-- frame -->
          <path d="M145 250 L210 175 L250 250 Z" stroke-width="7"/>
          <path d="M210 175 L310 130" stroke-width="7"/>
          <path d="M145 250 L310 130" stroke-width="5.5" opacity="0.9"/>
          <path d="M310 130 L338 250" stroke-width="7"/>
          <!-- seat -->
          <path d="M192 168 L228 160" stroke-width="9" stroke="#1a2530"/>
          <!-- handlebar -->
          <path d="M300 124 L322 108" stroke-width="6"/>
          <path d="M322 108 L348 114" stroke-width="6"/>
          <circle cx="348" cy="114" r="5" fill="#e76f51" stroke="none"/>
          <!-- crank -->
          <circle cx="210" cy="248" r="12" fill="#2f3e4e" stroke="#243447" stroke-width="3"/>
          <g>
            <animateTransform attributeName="transform" type="rotate"
              from="0 210 248" to="360 210 248" dur="1.1s" repeatCount="indefinite"/>
            <line x1="210" y1="248" x2="232" y2="268" stroke-width="4"/>
            <line x1="210" y1="248" x2="188" y2="228" stroke-width="4"/>
            <rect x="228" y="265" width="20" height="7" rx="2" fill="#f4a261" stroke="none"/>
            <rect x="172" y="224" width="20" height="7" rx="2" fill="#f4a261" stroke="none"/>
          </g>
        </g>

        <!-- rear wheel -->
        <g transform="translate(145 250)">
          <circle r="48" fill="#f4f7fa" stroke="#1f2d3a" stroke-width="8"/>
          <circle r="48" fill="none" stroke="#3d4f5f" stroke-width="2" opacity="0.35"/>
          <g>
            <animateTransform attributeName="transform" type="rotate"
              from="0 0 0" to="360 0 0" dur="1.1s" repeatCount="indefinite"/>
            <g stroke="#6b7c8a" stroke-width="2.2">
              <line x1="0" y1="-40" x2="0" y2="40"/>
              <line x1="-40" y1="0" x2="40" y2="0"/>
              <line x1="-28" y1="-28" x2="28" y2="28"/>
              <line x1="28" y1="-28" x2="-28" y2="28"/>
              <line x1="-15" y1="-37" x2="15" y2="37"/>
              <line x1="37" y1="-15" x2="-37" y2="15"/>
            </g>
          </g>
          <circle r="9" fill="#2f3e4e"/>
        </g>

        <!-- front wheel -->
        <g transform="translate(338 250)">
          <circle r="48" fill="#f4f7fa" stroke="#1f2d3a" stroke-width="8"/>
          <circle r="48" fill="none" stroke="#3d4f5f" stroke-width="2" opacity="0.35"/>
          <g>
            <animateTransform attributeName="transform" type="rotate"
              from="0 0 0" to="360 0 0" dur="1.1s" repeatCount="indefinite"/>
            <g stroke="#6b7c8a" stroke-width="2.2">
              <line x1="0" y1="-40" x2="0" y2="40"/>
              <line x1="-40" y1="0" x2="40" y2="0"/>
              <line x1="-28" y1="-28" x2="28" y2="28"/>
              <line x1="28" y1="-28" x2="-28" y2="28"/>
              <line x1="-15" y1="-37" x2="15" y2="37"/>
              <line x1="37" y1="-15" x2="-37" y2="15"/>
            </g>
          </g>
          <circle r="9" fill="#2f3e4e"/>
        </g>

        <!-- pelican -->
        <g>
          <!-- legs -->
          <path d="M200 188 C192 210 186 228 180 242" fill="none" stroke="#e9a56a" stroke-width="6" stroke-linecap="round"/>
          <path d="M218 190 C228 215 236 235 242 248" fill="none" stroke="#e9a56a" stroke-width="6" stroke-linecap="round"/>
          <!-- feet on pedals -->
          <ellipse cx="178" cy="246" rx="10" ry="5" fill="#d4894f"/>
          <ellipse cx="244" cy="250" rx="10" ry="5" fill="#d4894f"/>

          <!-- body -->
          <ellipse cx="210" cy="155" rx="46" ry="38" fill="url(#bodyGrad)" stroke="#9aa8b5" stroke-width="2"/>
          <!-- wing folded -->
          <path d="M178 148
                   C150 128 128 138 122 162
                   C148 172 172 168 188 158 Z"
                fill="#dce5ee" stroke="#9aa8b5" stroke-width="1.6"/>
          <path d="M176 152 C158 146 142 150 134 160" fill="none" stroke="#b7c3ce" stroke-width="1.5"/>

          <!-- S neck (pelican signature) -->
          <path d="M248 145
                   C268 128 278 118 292 122
                   C308 126 318 138 312 152"
                fill="none" stroke="#f7fafc" stroke-width="22" stroke-linecap="round"/>
          <path d="M248 145
                   C268 128 278 118 292 122
                   C308 126 318 138 312 152"
                fill="none" stroke="#c5d0da" stroke-width="2" opacity="0.55"/>

          <!-- head -->
          <ellipse cx="318" cy="148" rx="26" ry="22" fill="#fbfcfe" stroke="#9aa8b5" stroke-width="1.8"/>
          <!-- eye -->
          <circle cx="328" cy="140" r="6.5" fill="#1a2530"/>
          <circle cx="330" cy="138" r="2.2" fill="#fff"/>
          <!-- brow -->
          <path d="M318 132 Q326 128 334 132" fill="none" stroke="#7b8b99" stroke-width="2" stroke-linecap="round"/>

          <!-- large throat pouch + upper beak -->
          <path d="M335 150
                   C355 142 378 148 392 168
                   C378 192 348 188 328 168 Z"
                fill="url(#pouch)" stroke="#c96f08" stroke-width="1.8"/>
          <path d="M336 152 C358 146 376 154 386 168" fill="none" stroke="#a85a06" stroke-width="1.4" opacity="0.45"/>
          <!-- upper mandible -->
          <path d="M334 148 L390 158 L336 156 Z" fill="#f0a33a" stroke="#c96f08" stroke-width="1.2"/>

          <!-- crest -->
          <path d="M300 132 C294 118 304 116 308 124 C304 112 316 114 318 124"
                fill="none" stroke="#6d7d8b" stroke-width="3" stroke-linecap="round"/>

          <!-- belly shade -->
          <ellipse cx="218" cy="168" rx="26" ry="16" fill="#cfd8e2" opacity="0.45"/>
        </g>
      </g>

      <!-- ground shadow -->
      <ellipse cx="240" cy="302" rx="110" ry="10" fill="#1e3a4c" opacity="0.18"/>
    </svg>
  </div>
  <p class="hint">车轮与曲柄会转 · 手机可直接看</p>
</body>
</html>
